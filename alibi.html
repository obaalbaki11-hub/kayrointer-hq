<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alibi — AI interrogation game | Kayro Interactive</title>
<meta name="description" content="Alibi: a fresh crime every round, four suspects with private backstories, and free-form interrogation. Every suspect lies. Only one is guilty. You get 15 questions.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ffffff'/><text y='72' font-size='60' font-family='Inter,sans-serif' font-weight='900' fill='%23000000' text-anchor='middle' x='50'>A</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080808; --bg2:#0e0e0e; --bg3:#141414;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.22);
  --text:#fff; --text2:#888; --text3:#555; --text4:#333;
  --red:#e11d2e; --amber:#c8a040; --green:#22c55e;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
.mono{font-family:var(--mono)}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;color:var(--text3);font-weight:600;text-transform:uppercase}

/* ── shell ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;height:60px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(8,8,8,.92);backdrop-filter:blur(12px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-mark{width:26px;height:26px;border-radius:7px;background:#fff;color:#000;display:grid;place-items:center;font-weight:900;font-size:14px}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.3px}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1.5px}
.top-right{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--text3)}
.top-link{color:var(--text2);text-decoration:none}
.top-link:hover{color:#fff}
main{max-width:1240px;margin:0 auto;padding:36px 24px 80px}

/* ── intro ── */
.intro{max-width:620px;margin:6vh auto 0;text-align:center}
.intro h1{font-size:clamp(38px,8vw,66px);font-weight:800;letter-spacing:-3px;line-height:.95;margin:18px 0 18px}
.intro p{font-size:15px;color:var(--text2);line-height:1.75;margin-bottom:12px}
.intro .fine{font-size:13px;color:var(--text3);line-height:1.7}
.diffs{display:grid;gap:10px;margin:32px 0 26px;text-align:left}
.diff{display:flex;align-items:flex-start;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color .15s,background .15s;width:100%;text-align:left}
.diff:hover{border-color:var(--border2)}
.diff[aria-pressed="true"]{border-color:#fff;background:var(--bg3)}
.diff-dot{width:9px;height:9px;border-radius:50%;background:var(--text4);margin-top:5px;flex:none}
.diff[aria-pressed="true"] .diff-dot{background:#fff}
.diff-name{font-size:15px;font-weight:700;margin-bottom:4px}
.diff-blurb{font-size:13px;color:var(--text3);line-height:1.6}
.diff-mult{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text4);flex:none;padding-top:3px}
.btn{display:inline-block;padding:14px 32px;background:#fff;color:#000;border-radius:10px;font-size:14px;font-weight:700}
.btn:hover{background:#e8e8e8}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{background:none;color:var(--text2);border:1px solid var(--border);padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600}
.btn-ghost:hover{color:#fff;border-color:var(--border2)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#c41726}

/* ── case layout ── */
.grid{display:grid;grid-template-columns:270px minmax(0,1fr) 280px;gap:14px;align-items:start}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px}
.panel-h{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h .kicker{white-space:nowrap}
.panel-b{padding:16px 18px}

/* brief */
.brief{margin-bottom:14px}
.brief h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-1.2px;margin:8px 0 12px}
.brief-text{font-size:14px;color:#aaa;line-height:1.8;max-width:78ch}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.fact{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;line-height:1.5}
.fact b{color:#fff;font-weight:600}
.ev{list-style:none;display:grid;gap:9px;margin-top:4px}
.ev li{font-size:12.5px;color:#999;line-height:1.65;padding-left:16px;position:relative}
.ev li::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--amber)}

/* suspects */
.sus{width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--border);display:block;transition:background .15s}
.sus:last-child{border-bottom:none}
.sus:hover{background:var(--bg3)}
.sus[aria-current="true"]{background:var(--bg3);box-shadow:inset 2px 0 0 #fff}
.sus-top{display:flex;align-items:baseline;gap:8px}
.sus-name{font-size:14px;font-weight:700;letter-spacing:-.2px}
.sus-age{font-family:var(--mono);font-size:10px;color:var(--text4)}
.sus-role{font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.5}
.sus-alibi{font-size:11.5px;color:var(--text2);margin-top:8px;line-height:1.6;font-style:italic;border-left:1px solid var(--border);padding-left:9px}
.sus-meta{display:flex;align-items:center;gap:8px;margin-top:9px}
.rattle{display:flex;gap:3px}
.rattle i{width:14px;height:3px;border-radius:2px;background:var(--text4)}
.rattle i.on{background:var(--red)}
.sus-count{font-family:var(--mono);font-size:10px;color:var(--text4);margin-left:auto}

/* interview */
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who-name{font-size:15px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-role{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{padding:18px;display:flex;flex-direction:column;gap:16px;min-height:340px;max-height:min(58vh,560px);overflow-y:auto}
.empty{margin:auto;text-align:center;color:var(--text4);font-size:13px;line-height:1.8;max-width:34ch}
.turn{display:flex;flex-direction:column;gap:5px;max-width:86%}
.turn.you{align-self:flex-end;align-items:flex-end}
.turn-who{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;color:var(--text4);text-transform:uppercase}
.bubble{font-size:14px;line-height:1.7;padding:12px 15px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.turn.you .bubble{background:#fff;color:#000;border-bottom-right-radius:4px;font-weight:500}
.turn.them .bubble{background:var(--bg3);border:1px solid var(--border);color:#e4e4e4;border-bottom-left-radius:4px}
.turn.sys .bubble{background:none;border:1px dashed var(--border);color:var(--text3);font-size:12.5px}
.turn.sys{align-self:center;max-width:100%}
.thinking{display:flex;gap:4px;padding:14px 15px}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:bob 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ask{border-top:1px solid var(--border);padding:14px 18px;display:flex;gap:10px;align-items:flex-end}
.ask textarea{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:11px;color:#fff;font-family:inherit;font-size:14px;padding:12px 14px;resize:none;line-height:1.6;max-height:130px}
.ask textarea::placeholder{color:var(--text4)}
.ask textarea:disabled{opacity:.5}
.send{background:#fff;color:#000;border-radius:11px;padding:12px 18px;font-size:13px;font-weight:700;flex:none}
.send[disabled]{opacity:.4;cursor:not-allowed}
.ask-meta{padding:0 18px 14px;font-family:var(--mono);font-size:10.5px;color:var(--text4);display:flex;justify-content:space-between;gap:10px}

/* notebook */
.note-tabs{display:flex;gap:4px}
.note-tab{font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:5px 9px;border-radius:7px;color:var(--text3);text-transform:uppercase}
.note-tab[aria-pressed="true"]{background:var(--bg3);color:#fff}
.notes{padding:10px 12px;display:grid;gap:8px;max-height:min(52vh,520px);overflow-y:auto}
.note{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 11px}
.note-head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.note-who{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:#fff;text-transform:uppercase}
.note-time{font-family:var(--mono);font-size:9.5px;color:var(--amber);margin-left:auto;flex:none}
.note-text{font-size:12px;color:#aaa;line-height:1.6}
.notes-empty{padding:26px 14px;text-align:center;font-size:12px;color:var(--text4);line-height:1.7}

/* accuse bar */
.accuse-bar{position:sticky;bottom:0;margin-top:14px;background:linear-gradient(transparent,var(--bg) 40%);padding-top:18px;display:flex;justify-content:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:22px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;max-width:460px;width:100%;padding:26px}
.modal h2{font-size:21px;font-weight:800;letter-spacing:-.6px;margin:10px 0 8px}
.modal p{font-size:13.5px;color:var(--text2);line-height:1.7;margin-bottom:18px}
.pick{display:grid;gap:8px;margin-bottom:18px}
.pick button{display:flex;align-items:center;gap:11px;background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:13px 15px;text-align:left;font-size:14px;font-weight:600}
.pick button:hover{border-color:var(--red)}
.pick button[aria-pressed="true"]{border-color:var(--red);background:rgba(225,29,46,.1)}
.pick small{display:block;font-weight:400;color:var(--text3);font-size:11.5px;margin-top:2px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

/* verdict */
.verdict{max-width:760px;margin:0 auto}
.verdict-hero{text-align:center;padding:30px 0 34px;border-bottom:1px solid var(--border);margin-bottom:28px}
.verdict-hero h1{font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-2px;margin:14px 0 10px}
.verdict-hero .sub{font-size:14.5px;color:var(--text2);line-height:1.75;max-width:46ch;margin:0 auto}
.score{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-2px;margin-top:22px}
.score small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--text3);margin-top:7px;font-weight:400}
.sec{margin-bottom:26px}
.sec h3{font-size:13px;font-weight:700;letter-spacing:-.2px;margin:0 0 12px;display:flex;align-items:center;gap:9px}
.sec h3::after{content:'';flex:1;height:1px;background:var(--border)}
.tl{list-style:none;display:grid;gap:0}
.tl li{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.65}
.tl li:last-child{border-bottom:none}
.tl time{font-family:var(--mono);font-size:11px;color:var(--amber);flex:none;width:68px;padding-top:2px}
.tl span{color:#b4b4b4}
.rev{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:17px 19px;margin-bottom:10px}
.rev.guilty{border-color:rgba(225,29,46,.5);background:rgba(225,29,46,.05)}
.rev-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.rev-name{font-size:15px;font-weight:700}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;padding:3px 8px;border-radius:5px;text-transform:uppercase;font-weight:600}
.tag.g{background:var(--red);color:#fff}
.tag.i{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.rev-row{font-size:12.5px;line-height:1.7;color:#a4a4a4;margin-bottom:7px}
.rev-row:last-child{margin-bottom:0}
.rev-row b{color:var(--text3);font-weight:600;font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;display:block;margin-bottom:3px}

/* status */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#fff;color:#000;font-size:13px;font-weight:600;padding:12px 20px;border-radius:11px;z-index:60;max-width:calc(100vw - 40px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.loading{max-width:460px;margin:12vh auto;text-align:center}
.loading .bar{height:2px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:24px}
.loading .bar i{display:block;height:100%;width:38%;background:#fff;animation:sweep 1.5s infinite ease-in-out}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}
.loading h2{font-size:19px;font-weight:700;margin:16px 0 8px;letter-spacing:-.4px}
.loading p{font-size:13px;color:var(--text3);line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

@media(max-width:1060px){
  .grid{grid-template-columns:1fr}
  .log{max-height:none}
  .notes{max-height:340px}
}
@media(max-width:560px){
  main{padding:24px 16px 70px}
  .top{padding:0 16px}
  .brand-sub{display:none}
  .turn{max-width:95%}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/">
    <div class="brand-mark">K</div>
    <div>
      <div class="brand-name">Alibi</div>
      <div class="brand-sub">KAYRO INTERACTIVE</div>
    </div>
  </a>
  <div class="top-right">
    <span id="hud" class="sr">—</span>
    <a class="top-link" href="/">← kayrointer.com</a>
  </div>
</header>

<main id="stage" aria-live="polite"></main>

<script type="module">
import { QUESTION_BUDGET, DIFFICULTIES } from './alibi-prompts.js';

const API = 'https://kayro-backend.obaalbaki11.workers.dev/api/alibi';
const stage = document.getElementById('stage');
const hud = document.getElementById('hud');

const S = {
  screen: 'intro',
  difficulty: 'detective',
  kase: null,
  active: null,
  log: {},        // suspectId → [{who:'you'|'them', text}]
  notes: [],      // {sid, name, text, time, order}
  rattle: {},     // suspectId → 0..3
  noteView: 'suspect',
  busy: false,
  verdict: null,
};

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

function toast(msg, ms = 4200) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

async function call(payload) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const e = new Error(data.message || 'Something went wrong. Try again.');
    e.code = data.error;
    e.status = res.status;
    throw e;
  }
  return data;
}

/** Sort key for a claim's clock time, so the timeline view can surface clashes. */
function minutes(t) {
  const m = /(\d{1,2})[:.](\d{2})\s*(am|pm)?/i.exec(t || '');
  if (!m) {
    const h = /(\d{1,2})\s*(am|pm)/i.exec(t || '');
    if (!h) return null;
    return ((parseInt(h[1], 10) % 12) + (/pm/i.test(h[2]) ? 12 : 0)) * 60;
  }
  let hh = parseInt(m[1], 10) % 12;
  if (m[3] && /pm/i.test(m[3])) hh += 12;
  else if (!m[3] && parseInt(m[1], 10) >= 13) hh = parseInt(m[1], 10);
  return hh * 60 + parseInt(m[2], 10);
}

/**
 * Cases that run past midnight would otherwise sort 12:05am ahead of 9:52pm. If the
 * claims on the board actually straddle late evening and small hours, push the small
 * hours onto the next day. Decided across the whole set, so a plain morning case
 * (9am, 11am) is left alone.
 */
function timeOrderer(rows) {
  const mins = rows.map((r) => minutes(r.time)).filter((m) => m !== null);
  const wraps = mins.some((m) => m >= 20 * 60) && mins.some((m) => m < 4 * 60);
  return (t) => {
    const m = minutes(t);
    if (m === null) return null;
    return wraps && m < 4 * 60 ? m + 24 * 60 : m;
  };
}

// ── INTRO ─────────────────────────────────────────────────────
function renderIntro() {
  hud.textContent = 'Alibi — ready';
  stage.innerHTML = `
    <div class="intro">
      <div class="kicker">// a kayro interactive prototype</div>
      <h1>Alibi</h1>
      <p>A fresh crime every round. Four suspects, each with a private backstory, a secret and a reason to lie. <strong>Only one of them did it.</strong></p>
      <p class="fine">The innocent ones are hiding something embarrassing that makes them look guilty — so nervous behaviour proves nothing. You have to catch a real contradiction. ${QUESTION_BUDGET} questions, then you name someone.</p>
      <div class="diffs" role="group" aria-label="Difficulty">
        ${Object.entries(DIFFICULTIES).map(([key, d]) => `
          <button class="diff" data-diff="${key}" aria-pressed="${S.difficulty === key}">
            <span class="diff-dot"></span>
            <span>
              <span class="diff-name">${esc(d.label)}</span>
              <span class="diff-blurb">${esc(d.blurb)}</span>
            </span>
            <span class="diff-mult">×${d.multiplier}</span>
          </button>`).join('')}
      </div>
      <button class="btn" id="start">Open a case file</button>
      <p class="fine" style="margin-top:20px">Built with Claude. Every case, suspect and lie is generated at runtime — nothing here is scripted.</p>
    </div>`;

  stage.querySelectorAll('.diff').forEach((b) => b.addEventListener('click', () => {
    S.difficulty = b.dataset.diff;
    stage.querySelectorAll('.diff').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  document.getElementById('start').addEventListener('click', newCase);
}

function renderLoading() {
  hud.textContent = 'Generating case…';
  stage.innerHTML = `
    <div class="loading">
      <div class="kicker">// case generation</div>
      <h2>Building the case file</h2>
      <p>Writing the crime, the true timeline, and four people with something to hide. This takes a moment — it's a real model call, not a lookup.</p>
      <div class="bar"><i></i></div>
    </div>`;
}

async function newCase() {
  renderLoading();
  try {
    const data = await call({ action: 'new', difficulty: S.difficulty });
    S.kase = data;
    S.active = data.suspects[0].id;
    S.log = {};
    S.notes = [];
    S.rattle = {};
    S.verdict = null;
    S.screen = 'case';
    renderCase();
  } catch (e) {
    S.screen = 'intro';
    renderIntro();
    toast(e.message);
  }
}

// ── CASE ──────────────────────────────────────────────────────
function renderCase() {
  const k = S.kase;
  hud.textContent = `${k.questionsLeft} of ${k.budget} questions left`;
  stage.innerHTML = `
    <section class="brief">
      <div class="kicker">// ${esc(DIFFICULTIES[k.difficulty]?.label || k.difficulty)} · case open</div>
      <h1>${esc(k.title)}</h1>
      <p class="brief-text">${esc(k.crime)}</p>
      <div class="facts">
        <span class="fact"><b>Scene</b> · ${esc(k.scene)}</span>
        <span class="fact"><b>Harmed</b> · ${esc(k.victim)}</span>
        <span class="fact"><b>Window</b> · ${esc(k.window)}</span>
      </div>
    </section>

    <div class="grid">
      <div>
        <div class="panel" style="margin-bottom:14px">
          <div class="panel-h"><span class="kicker">// suspects</span></div>
          <div id="suspects"></div>
        </div>
        <div class="panel">
          <div class="panel-h"><span class="kicker">// established facts</span></div>
          <div class="panel-b">
            <ul class="ev">${k.evidence.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>
          </div>
        </div>
      </div>

      <div class="panel" id="interview">
        <div class="panel-h">
          <div class="who" id="who"></div>
          <span class="kicker" id="qleft">${k.questionsLeft} left</span>
        </div>
        <div class="log" id="log"></div>
        <div class="ask">
          <label class="sr" for="q">Your question</label>
          <textarea id="q" rows="1" placeholder="Where were you when the alarm went off?" maxlength="300"></textarea>
          <button class="send" id="send">Ask</button>
        </div>
        <div class="ask-meta">
          <span>Enter to ask · Shift+Enter for a new line</span>
          <span id="chars">0/300</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h">
          <span class="kicker">// notebook</span>
          <div class="note-tabs" role="group" aria-label="Notebook order">
            <button class="note-tab" data-view="suspect" aria-pressed="${S.noteView === 'suspect'}">By person</button>
            <button class="note-tab" data-view="time" aria-pressed="${S.noteView === 'time'}">By time</button>
          </div>
        </div>
        <div class="notes" id="notes"></div>
      </div>
    </div>

    <div class="accuse-bar"><button class="btn btn-danger" id="accuse">Make an accusation</button></div>`;

  renderSuspects();
  renderWho();
  renderLog();
  renderNotes();

  const q = document.getElementById('q');
  const chars = document.getElementById('chars');
  q.addEventListener('input', () => {
    q.style.height = 'auto';
    q.style.height = Math.min(q.scrollHeight, 130) + 'px';
    chars.textContent = `${q.value.length}/300`;
  });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
  });
  document.getElementById('send').addEventListener('click', ask);
  document.getElementById('accuse').addEventListener('click', openAccuse);
  stage.querySelectorAll('.note-tab').forEach((b) => b.addEventListener('click', () => {
    S.noteView = b.dataset.view;
    stage.querySelectorAll('.note-tab').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderNotes();
  }));
  if (!S.busy) q.focus();
}

function renderSuspects() {
  const host = document.getElementById('suspects');
  if (!host) return;
  host.innerHTML = S.kase.suspects.map((s) => {
    const r = S.rattle[s.id] || 0;
    const n = (S.log[s.id] || []).filter((t) => t.who === 'you').length;
    return `
      <button class="sus" data-sid="${s.id}" aria-current="${S.active === s.id}">
        <span class="sus-top"><span class="sus-name">${esc(s.name)}</span><span class="sus-age">${esc(s.age)}</span></span>
        <span class="sus-role">${esc(s.role)}</span>
        <span class="sus-alibi">“${esc(s.publicAlibi)}”</span>
        <span class="sus-meta">
          <span class="rattle" title="How rattled they are" aria-label="Rattled ${r} of 3">
            ${[1, 2, 3].map((i) => `<i class="${r >= i ? 'on' : ''}"></i>`).join('')}
          </span>
          <span class="sus-count">${n ? n + (n === 1 ? ' q' : ' qs') : '—'}</span>
        </span>
      </button>`;
  }).join('');
  host.querySelectorAll('.sus').forEach((b) => b.addEventListener('click', () => {
    if (S.busy) { toast('Wait for the answer first.'); return; }
    S.active = b.dataset.sid;
    renderSuspects(); renderWho(); renderLog();
    // Stacked layout puts the interview below the roster — bring it to the player.
    if (window.matchMedia('(max-width:1060px)').matches) {
      document.getElementById('interview')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    document.getElementById('q')?.focus();
  }));
}

function activeSuspect() { return S.kase.suspects.find((s) => s.id === S.active); }

function renderWho() {
  const s = activeSuspect();
  const el = document.getElementById('who');
  if (el && s) el.innerHTML = `<span class="who-name">${esc(s.name)}</span><span class="who-role">· ${esc(s.role)}</span>`;
}

function renderLog() {
  const host = document.getElementById('log');
  if (!host) return;
  const turns = S.log[S.active] || [];
  const s = activeSuspect();
  if (!turns.length) {
    host.innerHTML = `<p class="empty">${esc(s.name)} is waiting. Ask about where they were, who they saw, or something another suspect told you.</p>`;
    return;
  }
  host.innerHTML = turns.map((t) => `
    <div class="turn ${t.who}">
      <span class="turn-who">${t.who === 'you' ? 'You' : t.who === 'sys' ? '' : esc(s.name)}</span>
      <div class="bubble">${esc(t.text)}</div>
    </div>`).join('');
  host.scrollTop = host.scrollHeight;
}

function pushTurn(sid, who, text) {
  (S.log[sid] = S.log[sid] || []).push({ who, text });
  if (sid === S.active) renderLog();
}

async function ask() {
  if (S.busy) return;
  const q = document.getElementById('q');
  const question = q.value.trim();
  if (!question) return;
  if (S.kase.questionsLeft <= 0) { toast('Out of questions. Name someone.'); return; }

  const sid = S.active;
  q.value = '';
  q.style.height = 'auto';
  document.getElementById('chars').textContent = '0/300';
  pushTurn(sid, 'you', question);
  setBusy(true);

  const log = document.getElementById('log');
  const wait = document.createElement('div');
  wait.className = 'turn them';
  wait.innerHTML = `<span class="turn-who">${esc(activeSuspect().name)}</span><div class="bubble thinking"><i></i><i></i><i></i></div>`;
  log.appendChild(wait);
  log.scrollTop = log.scrollHeight;

  try {
    const data = await askOnce({ action: 'ask', caseId: S.kase.caseId, suspect: sid, question });
    wait.remove();
    pushTurn(sid, 'them', data.reply);
    S.rattle[sid] = Math.max(S.rattle[sid] || 0, data.rattled || 0);
    S.kase.questionsLeft = data.questionsLeft;
    const name = S.kase.suspects.find((x) => x.id === sid).name;
    (data.claims || []).forEach((c, i) => S.notes.push({
      sid, name, text: c.text, time: c.time || '', order: S.notes.length + i,
    }));
    renderSuspects(); renderNotes(); updateCounters();
    if (data.questionsLeft === 0) {
      pushTurn(sid, 'sys', 'That was your last question. Time to name someone.');
      toast('Out of questions — make the accusation.');
    }
  } catch (e) {
    wait.remove();
    pushTurn(sid, 'sys', e.message);
    toast(e.message);
  } finally {
    setBusy(false);
    document.getElementById('q')?.focus();
  }
}

/**
 * KV is eventually consistent, so a question fired moments after the case was written
 * can occasionally miss it. One retry covers that; a second failure is real.
 */
async function askOnce(payload) {
  try {
    return await call(payload);
  } catch (e) {
    if (e.code === 'no_case') {
      await new Promise((r) => setTimeout(r, 900));
      return call(payload);
    }
    throw e;
  }
}

function setBusy(v) {
  S.busy = v;
  const send = document.getElementById('send');
  const q = document.getElementById('q');
  if (send) { send.disabled = v; send.textContent = v ? '…' : 'Ask'; }
  if (q) q.disabled = v;
}

function updateCounters() {
  const left = S.kase.questionsLeft;
  hud.textContent = `${left} of ${S.kase.budget} questions left`;
  const el = document.getElementById('qleft');
  if (el) el.textContent = `${left} left`;
}

function renderNotes() {
  const host = document.getElementById('notes');
  if (!host) return;
  if (!S.notes.length) {
    host.innerHTML = `<p class="notes-empty">Every checkable claim a suspect makes gets logged here automatically. Switch to <strong>by time</strong> to line up who claimed to be where.</p>`;
    return;
  }
  let rows = S.notes.slice();
  if (S.noteView === 'time') {
    const at = timeOrderer(rows);
    rows.sort((a, b) => {
      const ma = at(a.time), mb = at(b.time);
      if (ma === null && mb === null) return a.order - b.order;
      if (ma === null) return 1;
      if (mb === null) return -1;
      return ma - mb || a.order - b.order;
    });
  } else {
    const idx = {};
    S.kase.suspects.forEach((s, i) => { idx[s.id] = i; });
    rows.sort((a, b) => idx[a.sid] - idx[b.sid] || a.order - b.order);
  }
  host.innerHTML = rows.map((n) => `
    <div class="note">
      <div class="note-head">
        <span class="note-who">${esc(n.name.split(' ')[0])}</span>
        ${n.time ? `<span class="note-time">${esc(n.time)}</span>` : ''}
      </div>
      <div class="note-text">${esc(n.text)}</div>
    </div>`).join('');
}

// ── ACCUSE ────────────────────────────────────────────────────
function openAccuse() {
  if (S.busy) { toast('Wait for the answer first.'); return; }
  let chosen = null;
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="acc-t">
      <div class="kicker">// charge sheet</div>
      <h2 id="acc-t">Who did it?</h2>
      <p>One name. Get it wrong and the case closes unsolved — the real one walks.</p>
      <div class="pick">
        ${S.kase.suspects.map((s) => `
          <button data-sid="${s.id}" aria-pressed="false">
            <span>${esc(s.name)}<small>${esc(s.role)}</small></span>
          </button>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancel">Keep questioning</button>
        <button class="btn btn-danger" id="charge" disabled>Charge them</button>
      </div>
    </div>`;
  document.body.appendChild(scrim);

  const charge = scrim.querySelector('#charge');
  scrim.querySelectorAll('.pick button').forEach((b) => b.addEventListener('click', () => {
    chosen = b.dataset.sid;
    scrim.querySelectorAll('.pick button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    charge.disabled = false;
  }));
  scrim.querySelector('#cancel').addEventListener('click', () => scrim.remove());
  scrim.addEventListener('click', (e) => { if (e.target === scrim) scrim.remove(); });
  charge.addEventListener('click', async () => {
    charge.disabled = true;
    charge.textContent = 'Filing…';
    try {
      const data = await call({ action: 'accuse', caseId: S.kase.caseId, suspect: chosen });
      scrim.remove();
      S.verdict = data;
      S.screen = 'verdict';
      renderVerdict();
    } catch (e) {
      charge.disabled = false;
      charge.textContent = 'Charge them';
      toast(e.message);
    }
  });
  scrim.querySelector('.pick button')?.focus();
}

// ── VERDICT ───────────────────────────────────────────────────
function renderVerdict() {
  const v = S.verdict;
  hud.textContent = v.correct ? 'Case closed' : 'Case unsolved';
  window.scrollTo({ top: 0 });
  stage.innerHTML = `
    <div class="verdict">
      <div class="verdict-hero">
        <div class="kicker">// ${v.correct ? 'case closed' : 'case unsolved'}</div>
        <h1 style="color:${v.correct ? '#fff' : 'var(--red)'}">${v.correct ? 'You got them.' : 'Wrong person.'}</h1>
        <p class="sub">${v.correct
          ? `${esc(v.culpritName)} did it, and you named ${esc(v.culpritName)} in ${v.questionsUsed} question${v.questionsUsed === 1 ? '' : 's'}.`
          : `You charged ${esc(v.accusedName)}. It was <strong>${esc(v.culpritName)}</strong> — who is now free to do it again.`}</p>
        <div class="score">${v.score.points.toLocaleString()}<small>${esc(v.score.rank.toUpperCase())} · ${esc(v.score.detail)}</small></div>
      </div>

      <div class="sec">
        <h3>What actually happened</h3>
        <ul class="tl">${v.trueTimeline.map((t) => `<li><time>${esc(t.time)}</time><span>${esc(t.event)}</span></li>`).join('')}</ul>
      </div>

      <div class="sec">
        <h3>What each of them was hiding</h3>
        ${v.reveal.map((r) => `
          <div class="rev ${r.guilty ? 'guilty' : ''}">
            <div class="rev-head">
              <span class="rev-name">${esc(r.name)}</span>
              <span class="tag ${r.guilty ? 'g' : 'i'}">${r.guilty ? 'guilty' : 'innocent'}</span>
              ${r.id === v.accusedId ? '<span class="tag i">you charged them</span>' : ''}
            </div>
            <div class="rev-row"><b>The secret</b>${esc(r.secret)}</div>
            <div class="rev-row"><b>Where they really were</b>${esc(r.truth)}</div>
          </div>`).join('')}
      </div>

      <div style="display:flex;gap:10px;justify-content:center;padding:10px 0 20px;flex-wrap:wrap">
        <button class="btn" id="again">New case</button>
        <a class="btn-ghost" href="/" style="text-decoration:none;display:inline-block">Back to Kayro</a>
      </div>
    </div>`;
  document.getElementById('again').addEventListener('click', () => { S.screen = 'intro'; renderIntro(); });
}

renderIntro();
</script>
</body>
</html>
